<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faef">
  <meta name="description" content="역대 최애와 덕질 기간으로 시작하는 ChatGPT 덕질 연대기 분석. 프롬프트를 복사하고 ChatGPT에서 붙여 넣어 보세요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="나의 덕질 연대기">
  <meta property="og:description" content="최애 이름과 기간만 적으면 AI가 입덕·탈덕 계기를 인터뷰하고 덕질 성향과 다음 최애를 분석해 줘요.">
  <title>나의 덕질 연대기</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./prompt.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="panel">
    <div class="symbol" aria-hidden="true">♡</div>
    <p class="eyebrow">MY FANDOM ARCHIVE</p>
    <h1>나의 덕질 연대기</h1>
    <p class="description">역대 최애와 덕질 기간만 알려주면<br class="desktop-break"> ChatGPT가 입덕·탈덕 이야기를 듣고 취향, 미래시와 결과 카드까지 만들어 줘.</p>
    <div class="actions">
      <button id="copy-button" type="button" class="primary">프롬프트 복사 <span aria-hidden="true">⧉</span></button>
      <a class="secondary" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT로 이동 <span aria-hidden="true">↗</span></a>
    </div>
    <p id="status" class="status" role="status" aria-live="polite">① 프롬프트 복사 → ② ChatGPT에서 붙여넣기</p>
    <p class="fine">인터뷰와 결과 카드 생성은 각자의 ChatGPT에서 진행돼.<br>이미지 생성에는 계정별 이용 한도가 있을 수 있어.</p>
  </main>
  <footer>팬이 만든 비공식 링크 페이지 · OpenAI 및 소속사와 무관</footer>
</body>
</html>
